name: SMPWeapons
version: '2.1.0'
main: dev.smpweapons.SMPWeapons
api-version: '1.21.11'
description: Custom weapons, events, Flowering Sanctuary and protected-region support.
depend: [WorldGuard, WorldEdit]

commands:
  smpweaponadmin:
    description: Manage weapons, reload settings, and control events.
    aliases: [swadmin, swa, smpadmin]
    permission: smpweapons.admin
  trust:
    description: Prevent your abilities from hurting a trusted player.
  untrust:
    description: Remove a player from your trust list.
  ability:
    description: Manually trigger a custom weapon ability.

permissions:
  smpweapons.admin:
    description: Access SMPWeapons operator commands.
    default: op
